[package]
name = "qcm-player"
version.workspace = true
license.workspace = true
authors.workspace = true
standard = "c++23"

[lib]
name = "qcm-player"
module = "qcm.player"
archive = "qcm_player"

[usage]
threads = true

[[bin]]
name = "qcm-player"
module = "qcm.player.bin"
path = "src/bin/main.cppm"
source-root = "src/bin"

[dependencies]
rstd-std = { workspace = true, pub = true }
rstd-log = { workspace = true }
wavsen = { workspace = true, pub = true }
lifetchto = { workspace = true }
lihttpto = { workspace = true }
rstd-json = { workspace = true }
rstd-serde = { workspace = true }
rstd-serde-macro = { workspace = true }

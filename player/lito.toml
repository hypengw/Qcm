[package]
name = "qcm-player"
version.workspace = true
standard = "c++23"

[lib]
name = "qcm-player"
module = "qcm.player"
archive = "qcm_player"

[usage]
threads = true

[[bin]]
name = "qcm-player"
module = "qcm.player.bin"
path = "src/bin/main.cppm"
source-root = "src/bin"

[dependencies.rstd-std]
workspace = true
pub = true

[dependencies.rstd-log]
workspace = true

[dependencies.wavsen]
workspace = true
pub = true

[dependencies.lifetchto]
workspace = true

[dependencies.lihttpto]
workspace = true

[dependencies.rstd-json]
workspace = true

[dependencies.rstd-serde]
workspace = true

[dependencies.rstd-serde-macro]
workspace = true

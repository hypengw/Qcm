[package]
name = "qcm-backend"
version.workspace = true
license.workspace = true
authors.workspace = true
standard = "c++23"

[lib]
name = "qcm-backend"
module = "qcm.backend"
archive = "qcm_backend"
source-groups = ["resource-impl", "sync-batch-impl"]

[source-groups.resource-impl]
sources = [
  "src/resource/cleanup.cpp",
  "src/resource/download.cpp",
  "src/resource/materialize.cpp",
  "src/resource/metadata.cpp",
  "src/resource/object_service.cpp",
  "src/resource/objects.cpp",
  "src/resource/reader.cpp",
  "src/resource/segments.cpp",
  "src/resource/storage_core.cpp",
]

[source-groups.sync-batch-impl]
sources = [
  "src/db/sync_batch/albums.cpp",
  "src/db/sync_batch/artists.cpp",
  "src/db/sync_batch/batch.cpp",
  "src/db/sync_batch/dynamics.cpp",
  "src/db/sync_batch/images.cpp",
  "src/db/sync_batch/libraries.cpp",
  "src/db/sync_batch/mix_contents.cpp",
  "src/db/sync_batch/relations.cpp",
  "src/db/sync_batch/remote_mix.cpp",
  "src/db/sync_batch/song_albums.cpp",
  "src/db/sync_batch/songs.cpp",
]

[dependencies]
qcm-protocol = { workspace = true, pub = true }
qcm-backend-macro = { workspace = true }
rstd-log = { workspace = true }
rstd-parse = { workspace = true }
rstd-argparse = { workspace = true, pub = true }
rstd-bench = { workspace = true }
rstd-macro = { workspace = true }
rstd-json = { workspace = true, pub = true }
rstd-serde = { workspace = true, pub = true }
rstd-serde-macro = { workspace = true }
liorm = { workspace = true, pub = true }
liorm-macro = { workspace = true }
licrypto = { workspace = true, features = ["openssl"] }
liuuid = { workspace = true, pub = true }
liproto = { workspace = true, pub = true }
liproto-codegen = { workspace = true, usage = "tool" }
liserveto = { workspace = true, pub = true, features = ["websocket"] }
liwebsocketo = { workspace = true, pub = true }
lifetchto = { workspace = true, pub = true, features = ["tls"] }
liunicode = { workspace = true, pub = true }
luato = { workspace = true, pub = true }
luato-extra = { workspace = true, pub = true }
sqlito = { workspace = true, pub = true }
dbusto = { workspace = true, condition = 'target.os == "linux"' }
dbusto-macro = { workspace = true, condition = 'target.os == "linux"' }

[external-sources.qcm-proto]
workspace = true

[build-tools.protoc]
path = "protoc"

[[bin]]
name = "qcm"
sources = ["bin/main.cpp"]

[runtime-dependencies]
qcm-player = { workspace = true }

[package]
name = "qcm-plugin-lua"
authors = ["hypengw <hypengwip@gmail.com>"]
version = "0.1.0"
edition = "2021"

[dependencies]
qcm-core = { workspace = true}
log = "0.4"
tracing.workspace = true
sea-orm = "1"
serde = "1.0"
serde_json = "1.0"
chrono = "0.4"
uuid = { workspace = true, features = ["v4"] }
reqwest.workspace = true
async-trait = "0.1"
tokio.workspace = true
mlua-extra = { git = "https://github.com/hypengw/mlua-extra", rev = "3f329f7ac6d8904a8675e55fb97c4d408230d10a", default-features = false, features = ["native-tls"] }

mlua = { version = "0.10", features = [
    "lua54",
    "async",
    "send",
    "error-send",
    "serialize",
] }

[dev-dependencies]
migration = { path = "../../main/migration" }

[package]
name = "qcm-playback-io"
version.workspace = true
standard = "c++23"

[lib]
name = "qcm-playback-io"
module = "qcm.playback.io"
archive = "qcm_playback_io"
sources = ["src/playback_io.cppm", "src/playback_io.cpp"]

[dependencies.qcm-core]
workspace = true
pub = true

[dependencies.wavsen]
workspace = true
pub = true

[dependencies.rstd-cppstd]
workspace = true

[external-dependencies.cmake.qt6]
workspace = true
targets = [{ name = "Qt6::Core" }, { name = "Qt6::Network" }]

[[test]]
name = "playback-io"
sources = ["tests/playback_io.cpp"]
